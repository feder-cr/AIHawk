name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  # This repository is public, and everything in it is English by rule. That was
  # a convention living in one person's head until 2026-09-02, when five files
  # and a whole test module turned out to be in Italian and nothing noticed:
  # pytest has no opinion about language, and the gate that checks it lived in a
  # sibling repository, so running it from here silently scanned the wrong tree.
  # A convention nobody enforces is a habit, and a habit skips a session.
  english:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the repository is English
        run: |
          python scripts/check_english_only.py --selftest
          python scripts/check_english_only.py

  # Every version on the index must have a GitHub release carrying it. Measured
  # 2026-09-02: five published versions, five tags, zero releases. The rule had
  # existed for months and both sibling packages enforce it with a test; this
  # repository did not, so the gap grew one release at a time with nothing
  # downstream breaking. The releases were backfilled by hand that day, and a gap
  # fixed by hand and guarded by nothing reopens on the next release.
  #
  # The job sets MCP_CHECK_RELEASES itself, so it cannot silently skip the way it
  # does in a local run.
  releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: every published version has a release page
        env:
          MCP_CHECK_RELEASES: "1"
          # One API call per version. Unauthenticated the limit is 60 an hour
          # per runner IP, shared with everything else on it.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          python -m pytest -q tests/test_release_pages.py

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: install and test
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
          python -m pytest -q

  # Measured 2026-09-04 on the sibling package: a version went to the index, main
  # gained two more changes while pyproject still named it, and a release from
  # there would have published NOTHING and reported success - publish.yml treats
  # an already-present version as a deliberate no-op, which is right for a
  # re-pushed tag and indistinguishable from somebody forgetting to bump. This
  # package has the same workflow and had the same hole.
  #
  # Pull requests only: on main straight after a release the version IS the
  # published one until somebody bumps, and a gate that is red at rest is one
  # people learn to skip. Bumping publishes nothing - main sitting on an
  # unreleased version is the normal state - so the cost is one line.
  version:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The gate diffs the tree against the tag of the published
          # version; a shallow clone has no tags and cannot tell.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: the version this change proposes is still free
        env:
          MCP_CHECK_VERSION: "1"
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          python -m pytest -q tests/test_version_is_not_taken.py
